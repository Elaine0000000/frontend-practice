<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园信息中心（迷你版）</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-md bg-body-tertiary mb-4">
    <div class="container">
      <a class="navbar-brand" href="#home">校园信息中心</a>
      <div class="navbar-nav">
        <a class="nav-link active" href="index.html">首页</a>
        <a class="nav-link" href="#stats">使用统计</a>
        <a class="nav-link" href="scene.html">校园三维</a>
      </div>
    </div>
  </nav>
<main>
  <section id="rooms" class="mb-4">
      <h2 class="h5">自习室查询</h2>
      <div class="row g-2 mb-3">
        <div class="col-auto">
          <label for="floor-filter" class="form-label">楼层</label>
          <select id="floor-filter" class="form-select">
            <option value="all">全部</option>
            <option value="1">1层</option>
            <option value="2">2层</option>
            <option value="3">3层</option>
            <option value="4">4层</option>
          </select>
        </div>
        <div class="col-auto">
          <label for="status-filter" class="form-label">状态</label>
          <select id="status-filter" class="form-select">
            <option value="all">全部</option>
            <option value="开放">开放</option>
            <option value="闭馆">闭馆</option>
            <option value="维修">维修</option>
          </select>
        </div>
      </div>
      <ul id="room-list" class="list-group"></ul>
    </section>
</main>

</body>
</html>
