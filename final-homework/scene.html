<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>校园三维导览</title>
  <style>
    body { margin: 0; }
    .back {
      position: fixed; top: 12px; left: 12px; z-index: 9;
      background: #fccaca; padding: 6px 14px; border-radius: 6px;
      text-decoration: none; color: #cdf601; font-family: sans-serif;
    }
  </style>
</head>
<body>
  <a class="back" href="final.html">← 返回首页</a>
  <a class="nav-link" href="canteen.html">食堂</a>
  <a class="nav-link" href="foods.html">菜品统计</a>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x223354);
    scene.fog = new THREE.Fog(0xff0000, 16, 60);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(7, 5, 9);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.5));
    const dir = new THREE.DirectionalLight(0xffffff, 0.8);
    dir.position.set(5, 8, 6);
    scene.add(dir);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(24, 24),
      new THREE.MeshStandardMaterial({ color: 0x3e5f3a })
    );
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    const stemMaterial = new THREE.MeshStandardMaterial({ color: 0x4caf50 });
    const petalMaterial = new THREE.MeshStandardMaterial({ color: 0xc2185b });
    const centerMaterial = new THREE.MeshStandardMaterial({ color: 0xffd54f });

    function createFlower() {
      const flower = new THREE.Group();

      const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.5, 6), stemMaterial);
      stem.position.y = 0.25;
      flower.add(stem);

      const core = new THREE.Mesh(new THREE.SphereGeometry(0.11, 12, 12), centerMaterial);
      core.position.y = 0.55;
      flower.add(core);

      const petalPositions = [
        [0.16, 0.55, 0], [-0.16, 0.55, 0],
        [0, 0.55, 0.16], [0, 0.55, -0.16]
      ];
      petalPositions.forEach(pos => {
        const petal = new THREE.Mesh(new THREE.SphereGeometry(0.12, 10, 10), petalMaterial);
        petal.position.set(...pos);
        petal.scale.set(1, 0.45, 1);
        flower.add(petal);
      });
      return flower;
    }
   const rows = 20;
   const cols = 20; 
   for (let r = 0; r < rows; r++) {
     for (let c = 0; c < cols; c++) {
     const flower = createFlower();
     flower.position.set(c * 1.5 - (cols - 1) * 0.75, 0, r * 1.5 - (rows - 1) * 0.75);
     scene.add(flower);
    }
  }

    const teaching = new THREE.Mesh(
      new THREE.BoxGeometry(4, 2.4, 2),
      new THREE.MeshStandardMaterial({ color: 0xdadada })
    );
    teaching.position.set(-3, 1.2, -2);
    scene.add(teaching);
    const roof = new THREE.Mesh(
      new THREE.BoxGeometry(4.4, 0.4, 2.4),
      new THREE.MeshStandardMaterial({ color: 0xb71c1c })
    );
    roof.position.set(-3, 2.6, -2);
    scene.add(roof);

    const library = new THREE.Mesh(
      new THREE.BoxGeometry(2.6, 1.8, 2.6),
      new THREE.MeshStandardMaterial({ color: 0xcfd8dc })
    );
    library.position.set(2.5, 0.9, -2.5);
    scene.add(library);

    const sculpture = new THREE.Mesh(
      new THREE.TorusKnotGeometry(0.6, 0.2, 96, 16),
      new THREE.MeshStandardMaterial({ color: 0x4fc3f7 })
    );
    sculpture.position.set(0, 1.4, 1.5);
    scene.add(sculpture);

    const flower = new THREE.Group();

const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 1, 8), stemMaterial);
stem.position.y = 0.5;
flower.add(stem);

const core = new THREE.Mesh(new THREE.SphereGeometry(0.18, 16, 16), centerMaterial);
core.position.y = 1.05;
flower.add(core);

const petalPositions = [
  [0.28, 1.05, 0], [-0.28, 1.05, 0],
  [0.14, 1.05, 0.24], [-0.14, 1.05, 0.24],
  [0.14, 1.05, -0.24], [-0.14, 1.05, -0.24]
];
petalPositions.forEach(pos => {
  const petal = new THREE.Mesh(new THREE.SphereGeometry(0.2, 12, 12), petalMaterial);
  petal.position.set(...pos);
  petal.scale.set(1, 0.45, 1);
  flower.add(petal);
});

flower.position.set(0, 0, 0);
scene.add(flower);

 const animate = () => {
      requestAnimationFrame(animate);
      sculpture.rotation.y += 0.01;
      renderer.render(scene, camera);
    };
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
