<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="survey-style.css">
  <title>我觉得这个配色很炫酷啊</title>
</head>
<body>
  <header>
    <h1>口味调研</h1>
    <p>你对作品中人物关系的爱好</p>
  </header>
  <nav>
    <a href="#intro">前言</a>
    <a href="#form">开始填写</a>
  </nav>
  <main>
    <section id="intro">
      <h2>前言</h2>
      <p>从以前的文学作品到现在的小说，游戏，动漫等等，绝大部分作品的塑造都离不开各种各样类型的人物。</p>
      <p>而人物之间的关系也是作品中不可或缺的一部分（不得不品的一环）。</p>
    </section>
    <section id="form">
      <h2>调查表</h2>
      <p><form action="#" method="get">
  <p>
    <label for="name">昵称（填个名字吧！）</label>
    <input type="text" id="name" name="name" placeholder="怎么称呼你" required>
  </p>
  <p>
    <label for="mail">邮箱</label>
    <input type="email" id="mail" name="mail" required>
  </p>
  <p>先进行一个简单的提问！</p>
  <p>你认为自己对不同类型人物的理解如何呢！</p>
  <p>
    <label><input type="radio" name="score" value="5" checked> 能理解绝大部分类型的人物</label>
    <label><input type="radio" name="score" value="4"> 能大致理解大部分类型的人物</label>
    <label><input type="radio" name="score" value="3"> 只能理解几种典型形象的人物</label>
  </p>
  <p>你喜欢的角色类型（可多选）</p>
  <p>
    <label><input type="checkbox" name="topic" value="6"> 正派</label>
    <label><input type="checkbox" name="topic" value="7"> 反派</label>
    <label><input type="checkbox" name="topic" value="8"> 单纯</label>
    <label><input type="checkbox" name="topic" value="9"> 复杂</label>
    <label><input type="checkbox" name="topic" value="10"> 坚定</label>
    <label><input type="checkbox" name="topic" value="11"> 犹豫</label>
    <label><input type="checkbox" name="topic" value="12"> 偏执</label>
    <label><input type="checkbox" name="topic" value="13"> 通达</label>
    <label><input type="checkbox" name="topic" value="14"> 圣人</label>
    <label><input type="checkbox" name="topic" value="15"> 神人</label>
    <label><input type="checkbox" name="topic" value="16"> 君子</label>
    <label><input type="checkbox" name="topic" value="17"> 小人</label>
    <label><input type="checkbox" name="topic" value="18"> 外冷内热</label>
    <label><input type="checkbox" name="topic" value="19"> 外热内冷</label>
    <label><input type="checkbox" name="topic" value="20"> 冷漠</label>
    <label><input type="checkbox" name="topic" value="21"> 热情</label>
    <label><input type="checkbox" name="topic" value="22"> 人机</label>
    <label><input type="checkbox" name="topic" value="23"> 伪人</label>
    <label><input type="checkbox" name="topic" value="24"> 理想主义</label>
    <label><input type="checkbox" name="topic" value="25"> 现实主义</label>
    <label><input type="checkbox" name="topic" value="26"> 积极</label>
    <label><input type="checkbox" name="topic" value="27"> 颓废</label>
  </p>
  <p>你喜欢的关系类型（可多选）</p>
  <p>
    <label><input type="checkbox" name="topic" value="36"> 好友（cb向）</label>
    <label><input type="checkbox" name="topic" value="37"> 恋人（cp向）</label>
    <label><input type="checkbox" name="topic" value="38"> 同志</label>
    <label><input type="checkbox" name="topic" value="39"> 同伙</label>
    <label><input type="checkbox" name="topic" value="40"> 陌生人</label>
    <label><input type="checkbox" name="topic" value="41"> 上下级</label>
    <label><input type="checkbox" name="topic" value="42"> 宿敌</label>
    <label><input type="checkbox" name="topic" value="43"> 多人组</label>
    <label><input type="checkbox" name="topic" value="44"> 青梅竹马</label>
    <label><input type="checkbox" name="topic" value="45"> 天降</label>
    <label><input type="checkbox" name="topic" value="46"> 对抗路</label>
    <label><input type="checkbox" name="topic" value="47"> 合作伙伴</label>
    <label><input type="checkbox" name="topic" value="48"> 君臣</label>
    <label><input type="checkbox" name="topic" value="49"> 欢喜冤家</label>
    <label><input type="checkbox" name="topic" value="50"> 化敌为友</label>
    <label><input type="checkbox" name="topic" value="51"> 友人决裂</label>
    <label><input type="checkbox" name="topic" value="52"> 破镜重圆</label>
    <label><input type="checkbox" name="topic" value="53"> 阴差阳错</label>
    <label><input type="checkbox" name="topic" value="54"> 恨海情天</label>
    <label><input type="checkbox" name="topic" value="55"> 传承</label>
    <label><input type="checkbox" name="topic" value="56"> 背叛</label>
    <label><input type="checkbox" name="topic" value="57"> 兰因絮果</label>
  </p>
  <p>
    <label for="advice">还有什么其他想说的吗！</label><br>
    <textarea id="advice" name="advice" rows="4" maxlength="1000" placeholder="说点什么"></textarea>
  </p>
  <p>-
    <button type="submit">提交！</button>
  </p>
</form></p>
    </section>
  </main>
  <footer>
    <p>对了你想听听我的产品吗。</p>
  </footer>
</body>
</html>
