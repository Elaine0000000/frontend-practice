<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>速食食品口味测评（自存）</title>
        <link rel="stylesheet" href="instant-food.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <nav class="navbar navbar-expand-md bg-body-tertiary mb-4">
        <div class="container">
            <a class="navbar-brand" href="#">这里是一些尝过的速食食品</a>
            <div class="navbar-nav">
                <a class="nav-link active" href="#">淘宝</a>
                <a class="nav-link" href="#">拼多多</a>
            </div>
        </div>
    </nav>
     <section id="instant-food">
      <h2>好吃的</h2>
      <p>喜欢吃3，能吃2，不大好吃1</p>
    <div class="row g-3">
        <div class="col-md-6 col-lg-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">白象汤好喝系列</h5>
                    <p class="card-text">老母鸡汤面3；猪骨汤面，羊肉汤面，金汤肥牛2；海鲜浓汤面1。</p>
                </div>
            </div>
        </div>
        <div class="col-md-6 col-lg-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">康师傅</h5>
                    <p class="card-text">红烧牛肉面3</p>
                </div>
            </div>
        </div>
        <div class="col-md-6 col-lg-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">日清出前一丁</h5>
                    <p class="card-text">所有口味都差不多，1-1.5分吧，菜太少，要煮，但是面太细了。</p>
                    <a href="#" class="btn btn-primary">查看详情</a>
                </div>
            </div>
        </div>
        <div class="col-md-6 col-lg-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">粉面菜蛋</h5>
                    <p class="card-text">金汤肥牛3其余2量比较大，比较饿的时候吃</p>
                </div>
            </div>
        </div>
        <div class="col-md-6 col-lg-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">今麦郎乌冬面</h5>
                    <p class="card-text">面饼有些大，不好煮，味道还行，比较像湿面。总体可以打2分。</p>
                </div>
            </div>
        </div>
        <div class="col-md-6 col-lg-4">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">农心辛拉面</h5>
                    <p class="card-text">除了燃辛太辣两分以外其余可以打三分，面需要煮但是味道很好，要是方便下点菜叶子应该会更好吃。</p>
                    <a href="https://e.tb.cn/h.8KXWql2xbOSAybe?tk=Lj4RThDCtYS" target="_blank">购买链接</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
